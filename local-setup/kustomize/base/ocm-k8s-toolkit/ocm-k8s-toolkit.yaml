apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ocm-k8s-toolkit
  namespace: default
spec:
  interval: 5m
  url: oci://ghcr.io/open-component-model/kubernetes/controller/chart
  ref:
    tag: "0.13.0"
    digest: sha256:e109bc641a6188aabe136c741e1a59b2a661b2a01ab255a60f3f5a171e8b6f71
---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocm-k8s-toolkit
  namespace: default
spec:
  releaseName: ocm-k8s-toolkit
  interval: 5m
  timeout: 15m
  targetNamespace: ocm-system
  chartRef:
    kind: OCIRepository
    name: ocm-k8s-toolkit
  values:
    manager:
      concurrency:
        resource: 3
