apiVersion: v1
kind: Namespace
metadata:
  name: kro-composition-operator
---
# KROaaS has no api-syncagent (it is kcp-native and composes in-workspace), so unlike
# the httpbin provider this deploys only the operator.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kro-composition-operator
  namespace: platform-mesh-system
spec:
  chartRef:
    kind: OCIRepository
    name: kro-composition-operator
    namespace: platform-mesh-system
  interval: 1m
  releaseName: kro-composition-operator
  targetNamespace: kro-composition-operator
  timeout: 15m
  values:
    # The kro.run provider connection (adminAuth) writes this kubeconfig secret.
    kubeconfigSecret: kro-provider-kubeconfig
    kcp:
      providerWorkspace: root:providers:kro-provider
      apiExportEndpointSlice: kro.run
    # Resolve the kcp shard VW hostnames to the in-cluster gateway (traefik) so the
    # operator can reach the APIExport virtual workspaces (same as api-syncagent).
    hostAliases:
      enabled: true
      values:
        - ip: "10.96.188.4"
          hostnames:
            - localhost
            - portal.localhost
            - kcp.localhost
            - root.kcp.localhost
            - triton.kcp.localhost
            - nereus.kcp.localhost
