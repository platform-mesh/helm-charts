suite: Test Kubernetes Gateway API
values:
- ../values.yaml
- ../test_values.yaml
release:
  name: kubernetes-graphql-gateway
  namespace: platform-mesh-system
chart:
  appVersion: 1.0.0
templates:
  - httproute.yaml
tests:
  - it: HTTPRoute with CORS disabled - match the Snapshot
    set:
      cors.mode: none
    asserts:
      - matchSnapshot: {}
  - it: HTTPRoute with native Gateway API CORS (default) - match the Snapshot
    set:
      cors.mode: native
    asserts:
      - matchSnapshot: {}
      - contains:
          path: spec.rules[0].filters
          content:
            type: CORS
            cors:
              allowMethods:
                - GET
                - OPTIONS
                - POST
              allowHeaders:
                - "*"
              allowCredentials: true
              maxAge: 100