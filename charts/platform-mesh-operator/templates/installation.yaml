{{- if .Values.installation.enabled }}
{{- if not .Values.installation.baseDomain }}
{{- fail "installation.baseDomain must be set when installation.enabled=true" }}
{{- end }}
{{- if and (eq .Values.installation.profile "kind") (not .Values.installation.traefikClusterIP) }}
{{- fail "installation.traefikClusterIP must be set to the ClusterIP of the Traefik Service when using the kind profile" }}
{{- end }}
apiVersion: delivery.ocm.software/v1alpha1
kind: Repository
metadata:
  name: platform-mesh
  namespace: {{ .Release.Namespace }}
spec:
  repositorySpec:
    baseUrl: ghcr.io/platform-mesh
    type: OCIRegistry
  interval: 1m
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Component
metadata:
  name: platform-mesh
  namespace: {{ .Release.Namespace }}
spec:
  repositoryRef:
    name: platform-mesh
  component: github.com/platform-mesh/platform-mesh
  semver: {{ .Values.installation.version | quote }}
  interval: 1m
  verify:
    - signature: helm-charts.platform-mesh
      secretRef:
        name: ocm-signing-public-cert
  ocmConfig:
    - kind: Repository
      apiVersion: delivery.ocm.software/v1alpha1
      name: platform-mesh
      namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocm-resolver-config
  namespace: {{ .Release.Namespace }}
data:
  .ocmconfig: |
    type: generic.config.ocm.software/v1
    configurations:
      - type: resolvers.config.ocm.software
        resolvers:
          - repository:
              type: OCIRegistry/v1
              baseUrl: europe-docker.pkg.dev
              subPath: gardener-project/releases
            componentNamePattern: "github.com/gardener/*"
---
apiVersion: core.platform-mesh.io/v1alpha1
kind: PlatformMesh
metadata:
  name: platform-mesh
  namespace: {{ .Release.Namespace }}
spec:
  exposure:
    port: {{ .Values.installation.port }}
    baseDomain: {{ .Values.installation.baseDomain | quote }}
    protocol: https
  ocm:
    repo:
      name: platform-mesh
    component:
      name: platform-mesh
    referencePath: []
  featureToggles:
    - name: feature-accounts-in-accounts
  kcp: {}
{{- end }}
