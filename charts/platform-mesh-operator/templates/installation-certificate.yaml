{{- if and .Values.installation.enabled .Values.installation.selfSignedCertificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: platform-mesh-domain-selfsigned
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-mesh-domain-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: platform-mesh-domain-ca
  secretName: {{ required "installation.selfSignedCertificate.caSecretName must be set when self-signed certificates are enabled" .Values.installation.selfSignedCertificate.caSecretName | quote }}
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: platform-mesh-domain-selfsigned
  usages:
    - cert sign
    - crl sign
    - digital signature
    - key encipherment
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: platform-mesh-domain-ca
  namespace: {{ .Release.Namespace }}
spec:
  ca:
    secretName: {{ .Values.installation.selfSignedCertificate.caSecretName | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-mesh-domain
  namespace: {{ .Release.Namespace }}
spec:
  commonName: {{ .Values.installation.baseDomain | quote }}
  dnsNames:
    - {{ .Values.installation.baseDomain | quote }}
    - {{ printf "*.%s" .Values.installation.baseDomain | quote }}
  secretName: {{ required "installation.certificateSecretName must be set when self-signed certificates are enabled" .Values.installation.certificateSecretName | quote }}
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: platform-mesh-domain-ca
  usages:
    - server auth
    - digital signature
    - key encipherment
{{- end }}
