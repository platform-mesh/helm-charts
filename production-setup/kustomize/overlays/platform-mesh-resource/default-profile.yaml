apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    components:
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: false
      services:
        account-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: account-operator
          syncWave: 4
          enabled: true
          values:
            crds:
              enabled: false
            kcp:
              apiExportEndpointSliceName: "core.platform-mesh.io"
            kubeconfigSecret: account-operator-kubeconfig
        extension-manager-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-operator
          syncWave: 4
          enabled: true
          values:
            crds:
              enabled: false
            kcp:
              enabled: true
              kubeconfigSecret: extension-manager-operator-kubeconfig
        infra:
          enabled: true
          imageResources:
          - name: keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.image.tag
          - name: busybox-image
            resource: busybox-image
            resourceName: busybox-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.waitForDb.image.tag
          - name: postgres-image
            resource: postgres-image
            resourceName: postgres-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: cnpg.cluster.image.tag
          - name: kcp-server-image
            resource: image
            absoluteReferencePath:
            - name: kcp
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.image.tag
              image-ref: combined
          - name: etcd-wrapper-image
            resource: etcd-wrapper-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.image.tag
              image-ref: combined
          - name: etcdbrctl-image
            resource: etcdbrctl-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.backup.image.tag
              image-ref: combined
          dependsOn:
          - name: keycloak-operator
            namespace: platform-mesh-system
          - name: cnpg-operator
            namespace: platform-mesh-system
          values:
            cnpg:
              enabled: true
            cors:
              enabled: true
            gatewayApi:
              enabled: true
            keycloak:
              operator:
                # REQUIRED: set to your production Keycloak URL
                hostname: https://REPLACE_ME/keycloak/
                enabled: true
                caSecret: domain-certificate-ca
                httpEnabled: false
            kcp:
              external:
                hostname: kcp.api.{{ .baseDomain }}
              auth:
                serviceAccount:
                  enabled: true
              frontProxy:
                port: 443
              rootShard:
                extraArgs:
                - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
              shards: []
              webhook:
                enabled: true
        iam-ui:
          enabled: true
          syncWave: 4
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-ui
        iam-service:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-service
          syncWave: 4
          enabled: true
          values:
            caSecret: domain-certificate-ca
            cors:
              enabled: true
        init-agent:
          absoluteReferencePath:
          - name: init-agent
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: init-agent
              image-ref: combined
            absoluteReferencePath:
            - name: init-agent
          syncWave: 4
          enabled: true
          values:
            configWorkspace: root:platform-mesh-system
            kcpKubeconfig: init-agent-kubeconfig
            replicas: 1
            leaderElection:
              enabled: true
        kcp:
          external: true
        kcp-operator:
          syncWave: 1
          external: true
          enabled: true
          imageResources:
          - name: kcp-operator-image
            annotations:
              repo: oci
              artifact: image
              for: kcp-operator
              image-ref: combined
          targetNamespace: kcp-operator
        keycloak-operator:
          enabled: true
          external: true
          imageResources:
          - name: keycloak-operator-keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            absoluteReferencePath:
              - name: keycloak-operator
              - name: image
            annotations:
              repo: oci
              artifact: image
              for: keycloak-operator
              path: keycloakImage.tag
          - name: keycloak-operator-image
            resource: manager-image
            resourceName: manager-image
            absoluteReferencePath:
              - name: keycloak-operator
              - name: image
            annotations:
              repo: oci
              artifact: image
              for: keycloak-operator
              path: image.tag
          absoluteReferencePath:
            - name: keycloak-operator
            - name: chart
          values:
            watchNamespaces: platform-mesh-system
        cnpg-operator:
          enabled: true
          external: true
          targetNamespace: platform-mesh-system
          absoluteReferencePath:
          - name: cnpg-operator
          imageResources:
          - name: cnpg-operator-image
            annotations:
              repo: oci
              artifact: image
              for: cnpg-operator
              image-ref: combined
        kubernetes-graphql-gateway:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: kubernetes-graphql-gateway
          syncWave: 4
          enabled: true
          values:
            gatewayApi:
              enabled: true
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            listener:
              virtualWorkspacesConfig:
                content:
                  virtualWorkspaces:
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: contentconfigurations
                    url: https://frontproxy-front-proxy.platform-mesh-system:443/services/contentconfigurations
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: marketplace
                    url: https://frontproxy-front-proxy.platform-mesh-system:443/services/marketplace
                enabled: true
            trust:
              default:
                audience: default
                jwksUrl: http://keycloak-headless.platform-mesh-system:8080/keycloak/realms/default/protocol/openid-connect/certs
                trustedIssuer: 'https://{{ .baseDomainPort }}/keycloak/realms/default'
        openfga:
          enabled: true
          external: true
          syncWave: 2
          suspend: true
          imageResources:
          - name: openfga-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              image-ref: combined
          - name: openfga-postgresql-image
            resource: postgresql-image
            resourceName: postgresql-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              path: postgresql.image.tag
              unsuspend: "true"
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              # REQUIRED: set via bootstrap.sh — references secret openfga-postgres-credentials
              uri: postgres://postgres:$(OPENFGA_POSTGRES_PASSWORD)@openfga-postgres.platform-mesh-system.svc.cluster.local:5432/postgres?sslmode=require
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            - name: OPENFGA_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openfga-postgres-credentials
                  key: password
            postgresql:
              enabled: true
              auth:
                # REQUIRED: set via bootstrap.sh — references secret openfga-postgres-credentials
                existingSecret: openfga-postgres-credentials
              nameOverride: postgres
            replicaCount: 1
        portal:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: portal
          syncWave: 4
          enabled: true
          values:
            auth:
              default:
                baseDomain: '{{ .baseDomain }}'
                clientId: welcome
                clientSecretKey: attribute.client_secret
                clientSecretName: portal-client-secret-welcome
                discoveryUrl: 'https://{{ .baseDomainPort }}/keycloak/realms/${org-name}/.well-known/openid-configuration'
            cookieDomain: '{{ .baseDomain }}'
            crdGatewayApiUrl: 'https://${org-subdomain}{{ .baseDomain }}/api/kubernetes-graphql-gateway/root:orgs:${org-name}/graphql'
            developmentLandcsape: "false"
            environment: production
            frontendPort: '443'
            gatewayApi:
              enabled: true
              httpRoute:
                parentRefs:
                - name: k8sapi-gateway
                  kind: Gateway
            http:
              protocol: https
            kcp:
              kubeconfigSecret: portal-kubeconfig
        rebac-authz-webhook:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: rebac-authz-webhook
          syncWave: 4
          enabled: true
          values:
            certManager:
              createCA: true
              enabled: true
            openfga:
              url: openfga:8081
        security-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: security-operator
          syncWave: 4
          enabled: true
          values:
            baseDomain: '{{ .baseDomainPort }}'
            caSecret: domain-certificate-ca
            crds:
              enabled: false
            fga:
              # REQUIRED: configure a production SMTP server
              # extraArgs:
              #   - --idp-smtp-server=smtp.example.com
              #   - --idp-smtp-port=587
              #   - --idp-from-address=noreply@example.com
              extraArgs:
                - --domain-ca-lookup
              inviteKeycloakBaseUrl: 'https://{{ .baseDomainPort }}/keycloak'
              target: openfga.platform-mesh-system.svc.cluster.local:8081
            initializer:
              kubeconfigSecret: security-initializer-kubeconfig
              extraArgs:
                - --domain-ca-lookup
                # REQUIRED: configure a production SMTP server
                # - --idp-smtp-server=smtp.example.com
                # - --idp-smtp-port=587
                # - --idp-from-address=noreply@example.com
            kubeconfigSecret: security-operator-kubeconfig
            operator:
              maxConcurrentReconciles: 5
              shutdownTimeout: 5m
            system:
              extraArgs:
              - --domain-ca-lookup
              # REQUIRED: configure a production SMTP server
              # - --idp-smtp-server=smtp.example.com
              # - --idp-smtp-port=587
              # - --idp-from-address=noreply@example.com
            terminator:
              kubeconfigSecret: security-terminator-kubeconfig
        virtual-workspaces:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: virtual-workspaces
          syncWave: 4
          enabled: true
          targetNamespace: platform-mesh-system
          values:
            virtualWorkspaceSecretName: virtual-workspaces-cert
            deployment:
              serverUrl: https://frontproxy-front-proxy.platform-mesh-system:443
              resourceSchemaName: "v250704-6d57f16.contentconfigurations.ui.platform-mesh.io"
              resourceSchemaWorkspace: "root:platform-mesh-system"
        marketplace-ui:
          enabled: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace-ui
          values:
            contentConfig:
              baseDomain: '{{ .baseDomain }}'
              protocol: https
            gatewayApi:
              enabled: true
        terminal-controller-manager:
          enabled: false
        observability:
          syncWave: 4
          enabled: true
          targetNamespace: observability
          imageResources:
          - name: otel-collector-image
            resource: otel-collector-image
            resourceName: otel-collector-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: otelCollector.image.tag
          - name: kubectl-image
            resource: kubectl-image
            resourceName: kubectl-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: serviceMonitors.kcp.certExtractor.image.tag
          - name: prometheus-server-image
            resource: prometheus-server-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: prometheus.server.image.tag
              image-ref: combined
          - name: prometheus-config-reloader-image
            resource: prometheus-config-reloader-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: prometheus.configmapReload.prometheus.image.tag
              image-ref: combined
          dependsOn:
          - name: prometheus-operator-crds
            namespace: platform-mesh-system
          - name: opentelemetry-operator
            namespace: platform-mesh-system
          values:
            prometheus:
              server:
                persistentVolume:
                  enabled: true
                extraFlags:
                - web.enable-remote-write-receiver
              alertmanager:
                enabled: true
      targetNamespace: platform-mesh-system
