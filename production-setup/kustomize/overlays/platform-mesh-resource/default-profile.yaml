apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-mesh-profile
  namespace: platform-mesh-system
data:
  profile.yaml: |
    infra:
      deploymentTechnology: fluxcd
      ocm:
        component:
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          name: platform-mesh
        skipVerify: true
      certManager:
        enabled: true
        interval: 1m
        name: cert-manager
        ocmResourceName: chart
        targetNamespace: default
        values:
          installCRDs: true
      gatewayApi:
        syncOptions:
        - ServerSideApply=true
        enabled: true
        interval: 1m
        name: gateway-api-crds
        chart:
          name: gateway-api-crds
        ocmResourceName: chart
        targetNamespace: default
      traefik:
        skipCrds: true
        syncOptions:
        - SkipCRDs=true
        syncWave: 1
        chart:
          name: traefik
        enabled: true
        interval: 1m
        name: traefik
        ocmResourceName: chart
        targetNamespace: default
        values:
          gateway:
            enabled: false
          gatewayClass:
            enabled: true
          deployment:
            podAnnotations: {}
          securityContext:
            capabilities:
              add:
              - NET_BIND_SERVICE
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          ports:
            websecure:
              port: 443
              expose:
                default: true
              exposedPort: 443
              protocol: TCP
          providers:
            kubernetesGateway:
              enabled: true
              experimentalChannel: true
          service:
            type: LoadBalancer
      etcdDruid:
        enabled: true
        interval: 1m
        name: etcd-druid
        ocmResourceName: etcd-druid
        ocmImageResourceName: image
        targetNamespace: etcd-druid-system
        values: {}
      traefikCRDs:
        chart:
          name: traefik-crds
        enabled: true
        interval: 1m
        name: traefik-crds
        ocmComponentName: traefik
        ocmResourceName: crds
        targetNamespace: default
        values:
          gatewayAPI: false
      prometheusOperatorCRDs:
        enabled: true
        interval: 1m
        name: prometheus-operator-crds
        ocmResourceName: chart
        ocmComponentName: prometheus-operator-crds
        targetNamespace: observability
        values: {}
      opentelemetryOperator:
        enabled: true
        interval: 1m
        name: opentelemetry-operator
        ocmResourceName: chart
        ocmComponentName: opentelemetry-operator
        targetNamespace: observability
        values:
          manager:
            featureGatesMap:
              operator.targetallocator.mtls: true
          admissionWebhooks:
            certManager:
              enabled: false
            autoGenerateCert:
              enabled: true
    components:
      # -- Change hostaliases here and all involved components will get the same hostaliases
      hostAliasesEntries: &hostAliasesEntries
        # REQUIRED: set the host aliases for kcp shards
        - ip: "{{ .traefikClusterIP }}"
          hostnames:
            - "{{ .baseDomain }}"
            - "kcp.api.{{ .baseDomain }}"
            # - kcp.root.localhost
            # - kcp.triton.localhost
            # - kcp.nereus.localhost
            # - localhost
      deploymentTechnology: fluxcd
      ocm:
        component:
          create: true
          name: platform-mesh
        interval: 3m
        referencePath: []
        repo:
          create: true
          name: platform-mesh
        skipVerify: true
      services:
        account-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: account-operator
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            crds:
              enabled: false
            kcp:
              apiExportEndpointSliceName: "core.platform-mesh.io"
            kubeconfigSecret: account-operator-kubeconfig
            log:
              level: debug
              noJson: true
            subroutines:
              fga:
                grpcAddr: openfga:8081
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        extension-manager-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: extension-manager-operator
          syncWave: 4
          enabled: true
          values:
            crds:
              enabled: false
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kcp:
              enabled: true
              kubeconfigSecret: extension-manager-operator-kubeconfig
            tracing:
              collector:
                host: observability-opentelemetry-collector.observability.svc.cluster.local:4317
              enabled: false
        infra:
          enabled: true
          imageResources:
          - name: keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.image.tag
          - name: busybox-image
            resource: busybox-image
            resourceName: busybox-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: keycloak.operator.waitForDb.image.tag
          - name: postgres-image
            resource: postgres-image
            resourceName: postgres-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: cnpg.cluster.image.tag
          - name: dex-image
            resource: dex-image
            resourceName: dex-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: dex.image.tag
          - name: kcp-server-image
            resource: image
            absoluteReferencePath:
            - name: kcp
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.image.tag
              image-ref: combined
          - name: etcd-wrapper-image
            resource: etcd-wrapper-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.image.tag
              image-ref: combined
          - name: etcdbrctl-image
            resource: etcdbrctl-image
            annotations:
              repo: oci
              artifact: image
              for: infra
              path: kcp.etcd.backup.image.tag
              image-ref: combined
          dependsOn:
          - name: keycloak-operator
            namespace: platform-mesh-system
          - name: cnpg-operator
            namespace: platform-mesh-system
          - name: traefik
            namespace: platform-mesh-system
          values:
            keycloak:
              operator:
                hostname: "https://{{ .baseDomainPort }}"
                httpEnabled: true
              gatewayApi:
                hostnames:
                  - "{{ .baseDomain }}"
              keycloakConfig:
                redirectUrls: ["http://localhost:8000/callback*"]
            dex:
              issuer: "https://{{ .baseDomainPort }}/dex"
              gatewayApi:
                hostnames:
                  - "{{ .baseDomain }}"
              staticClient:
                redirectURIs:
                  - "https://{{ .baseDomainPort }}/keycloak/realms/default/broker/dex/endpoint"
            cnpg:
              enabled: true
              roles:
                keycloak:
                  password: keycloak-password
                openfga:
                  password: openfga-password
            cors:
              enabled: true
            gatewayApi:
              enabled: true
              listeners:
                - name: terminate
                  hostname: "{{ .baseDomain }}"
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                - name: terminate-wildstar
                  hostname: "*.{{ .baseDomain }}"
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                - name: passthrough
                  port: 443
                  protocol: TLS
                  tls:
                    mode: Passthrough
                  allowedRoutes:
                    namespaces:
                      from: All
              listenersExtra:
                - name: terminate-services
                  hostname: "*.services.{{ .baseDomain }}"
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      - kind: Secret
                        name: domain-certificate
                        namespace: platform-mesh-system
                  allowedRoutes:
                    namespaces:
                      from: All
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            keycloak:
              operator:
                hostname: https://{{ .baseDomainPort }}/keycloak/
                enabled: true
                caSecret: domain-certificate-ca
                httpEnabled: true
                db:
                  password: keycloak-password
                admin:
                  password: admin
                  secret: admin
                health:
                  port: 9000
                  periodSeconds: 10
                  liveness:
                    path: /keycloak/health/live
                    failureThreshold: 3
                  readiness:
                    path: /keycloak/health/ready
                    initialDelaySeconds: 0
                    periodSeconds: 10
                  startup:
                    path: /keycloak/health
                    failureThreshold: 600
              service:
                name: keycloak-service
                port: 8080
              keycloakConfig:
                url: http://keycloak-service.platform-mesh-system.svc.cluster.local:8080/keycloak
            dex:
              enabled: true
              issuer: https://{{ .baseDomainPort }}/dex
              staticClient:
                redirectURIs:
                - https://{{ .baseDomainPort }}/keycloak/realms/default/broker/dex/endpoint
            kcp:
              external:
                hostname: kcp.api.{{ .baseDomain }}
                port: 443
              auth:
                serviceAccount:
                  enabled: true
              frontProxy:
                port: 443
              image:
                tag: v0.33.0
              rootShard:
                hostname: "root.kcp.{{ .baseDomain }}"
                shardBaseURL: https://root.kcp.{{ .baseDomain }}/
                extraArgs:
                - --feature-gates=WorkspaceAuthentication=true,CacheAPIs=true
              shards:
                - name: nereus
                  hostname: nereus.kcp.{{ .baseDomain }}
                - name: triton
                  hostname: triton.kcp.{{ .baseDomain }}
              webhook:
                enabled: true
            traefik:
              accessControlAllowOriginList:
              - https://{{ .baseDomainPort }}
              - https://*.{{ .baseDomain }}:443
        iam-ui:
          enabled: true
          syncWave: 4
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-ui
          values:
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
        iam-service:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: iam-service
          syncWave: 4
          enabled: true
          values:
            caSecret: domain-certificate-ca
            extraArgs:
            - --no-json
            cors:
              enabled: true
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
        init-agent:
          absoluteReferencePath:
          - name: init-agent
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: init-agent
              image-ref: combined
            absoluteReferencePath:
            - name: init-agent
          syncWave: 4
          enabled: true
          values:
            configWorkspace: root:platform-mesh-system
            kcpKubeconfig: init-agent-kubeconfig
            replicas: 1
            leaderElection:
              enabled: true
            hostAliases:
              enabled: true
              values:
                - ip: "{{ .traefikClusterIP }}"
                  hostnames:
                    - "kcp.api.{{ .baseDomain }}"
        kcp:
          external: true
        kcp-operator:
          syncWave: 1
          external: true
          enabled: true
          imageResources:
          - name: kcp-operator-image
            annotations:
              repo: oci
              artifact: image
              for: kcp-operator
              image-ref: combined
          targetNamespace: kcp-operator
        keycloak-operator:
          enabled: true
          external: true
          imageResources:
          - name: keycloak-operator-keycloak-image
            resource: keycloak-image
            resourceName: keycloak-image
            absoluteReferencePath:
              - name: keycloak-operator
              - name: image
            annotations:
              repo: oci
              artifact: image
              for: keycloak-operator
              path: keycloakImage.tag
          - name: keycloak-operator-image
            resource: manager-image
            resourceName: manager-image
            absoluteReferencePath:
              - name: keycloak-operator
              - name: image
            annotations:
              repo: oci
              artifact: image
              for: keycloak-operator
              path: image.tag
          absoluteReferencePath:
            - name: keycloak-operator
            - name: chart
          values:
            watchNamespaces: platform-mesh-system
        cnpg-operator:
          enabled: true
          external: true
          targetNamespace: platform-mesh-system
          absoluteReferencePath:
          - name: cnpg-operator
          imageResources:
          - name: cnpg-operator-image
            annotations:
              repo: oci
              artifact: image
              for: cnpg-operator
              image-ref: combined
        kubernetes-graphql-gateway:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: kubernetes-graphql-gateway
          syncWave: 4
          enabled: true
          values:
            gateway:
              playground: true
              logLevel: trace
            gatewayApi:
              enabled: true
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            kubeConfig:
              enabled: true
              secretName: kubernetes-graphql-gateway-kubeconfig
            listener:
              virtualWorkspacesConfig:
                content:
                  virtualWorkspaces:
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: contentconfigurations
                    url: "{{ .internalFrontProxyUrl }}/services/contentconfigurations"
                  - kubeconfig: /app/kubeconfig/kubeconfig
                    name: marketplace
                    url: "{{ .internalFrontProxyUrl }}/services/marketplace"
                enabled: true
            sentry:
              environment: dev
            tracing:
              enabled: false
            trust:
              default:
                audience: default
                jwksUrl: http://keycloak-headless.platform-mesh-system:8080/keycloak/realms/default/protocol/openid-connect/certs
                trustedIssuer: 'https://{{ .baseDomainPort }}/keycloak/realms/default'
        openfga:
          enabled: true
          external: true
          syncWave: 2
          suspend: true
          imageResources:
          - name: openfga-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              image-ref: combined
          - name: openfga-postgresql-image
            resource: postgresql-image
            resourceName: postgresql-image
            annotations:
              repo: oci
              artifact: image
              for: openfga
              path: postgresql.image.tag
              unsuspend: "true"
          values:
            autoscaling:
              enabled: false
            checkQueryCache:
              enabled: true
              limit: 10000
              ttl: 10s
            datastore:
              applyMigrations: true
              engine: postgres
              maxOpenConns: 30
              migrationType: initContainer
              migrations:
                image:
                  pullPolicy: Always
                  repository: groundnuty/k8s-wait-for
                  tag: v2.0
              uri: postgres://postgres:openfga-password@openfga-postgres.platform-mesh-system.svc.cluster.local:5432/postgres?sslmode=disable
            extraEnvVars:
            - name: OPENFGA_EXPERIMENTALS
              value: enable-list-users
            image:
              tag: v1.11.2
            log:
              level: info
            migrate:
              repository: openfga/openfga
              annotations:
                sidecar.istio.io/inject: "false"
            podAnnotations:
              traffic.sidecar.istio.io/excludeInboundPorts: "2112"
            postgresql:
              enabled: true
              auth:
                password: openfga-password
              image:
                registry: ghcr.io/platform-mesh
                repository: upstream-images/postgresql
                tag: 17.6.0-debian-12-r4
              nameOverride: postgres
            replicaCount: 1
            telemetry:
              trace:
                enabled: true
                otlp:
                  endpoint: observability-opentelemetry-collector.openmfp-observability.svc.cluster.local:4317
                  tls:
                    enabled: false
        portal:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: portal
          syncWave: 4
          enabled: true
          values:
            auth:
              default:
                baseDomain: '{{ .baseDomain }}'
                clientId: welcome
                clientSecretKey: attribute.client_secret
                clientSecretName: portal-client-secret-welcome
                discoveryUrl: 'https://{{ .baseDomainPort }}/keycloak/realms/${org-name}/.well-known/openid-configuration'
            cookieDomain: '{{ .baseDomain }}'
            crdGatewayApiUrl: 'https://${org-subdomain}{{ .baseDomain }}/api/kubernetes-graphql-gateway/root:orgs:${org-name}/graphql'
            environment: kind
            extraEnvVars:
            - name: OPENMFP_PORTAL_CONTEXT_IAM_SERVICE_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/iam/graphql
            - name: OPENMFP_PORTAL_CONTEXT_CRD_GATEWAY_API_URL
              value: https://${org-subdomain}{{ .baseDomainPort }}/gateway/api/clusters/root:orgs:${org-name}/graphql
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/ca-bundle.crt
            - name: OPENMFP_PORTAL_CONTEXT_AUTHZ_WEBHOOK_URL
              value: https://rebac-authz-webhook.platform-mesh-system.svc.cluster.local:9443
            initContainers:
            - name: combine-ca
              image: busybox:1.36
              command:
              - sh
              - -c
              - cat /domain-ca/tls.crt /webhook-ca/ca.crt > /combined-ca/ca-bundle.crt
              # busybox runs as root by default, but pod has runAsNonRoot
              securityContext:
                runAsUser: 1000
              volumeMounts:
              - name: domain-ca
                mountPath: /domain-ca
                readOnly: true
              - name: webhook-ca
                mountPath: /webhook-ca
                readOnly: true
              - name: combined-ca
                mountPath: /combined-ca
            extraVolumes:
            - name: domain-ca
              secret:
                secretName: domain-certificate-ca
            - name: webhook-ca
              secret:
                secretName: rebac-authz-webhook-cert
            - name: combined-ca
              emptyDir: {}
            extraVolumeMounts:
            - name: combined-ca
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
            frontendPort: '443'
            gatewayApi:
              enabled: true
              httpRoute:
                hostnames:
                - "{{ .baseDomain }}"
                - "*.{{ .baseDomain }}"
                parentRefs:
                - name: k8sapi-gateway
                  kind: Gateway
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            http:
              protocol: https
            kcp:
              kubeconfigSecret: portal-kubeconfig
        rebac-authz-webhook:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: rebac-authz-webhook
          syncWave: 4
          enabled: true
          values:
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            certManager:
              createCA: true
              enabled: true
            istio:
              dnsNames:
              - rebac-authz-webhook.platform-mesh-system.svc.cluster.local
              exposed: false
            log:
              level: debug
            openfga:
              url: openfga:8081
        security-operator:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: security-operator
          syncWave: 4
          enabled: true
          values:
            baseDomain: '{{ .baseDomainPort }}'
            caSecret: domain-certificate-ca
            crds:
              enabled: false
            openfga:
              endpoint: openfga.platform-mesh-system.svc.cluster.local:8081
            keycloak:
              baseUrl: 'https://{{ .baseDomainPort }}/keycloak'
            idp:
              smtp:
                # REQUIRED: configure a production SMTP server
                server: ""
                port: ""
                fromAddress: ""
              # Production defaults: invite-only, require email verification
              registrationAllowed: false
              allowUnverifiedEmails: false
              setDefaultPassword: false
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            initializer:
              kubeconfigSecret: security-initializer-kubeconfig
            kubeconfigSecret: security-operator-kubeconfig
            log:
              level: debug
              noJson: true
            terminator:
              kubeconfigSecret: security-terminator-kubeconfig
        terminal-controller-manager:
          enabled: false
        virtual-workspaces:
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: virtual-workspaces
          syncWave: 4
          enabled: true
          targetNamespace: platform-mesh-system
          values:
            virtualWorkspaceSecretName: virtual-workspaces-cert
            hostAliases:
              enabled: true
              entries: *hostAliasesEntries
            deployment:
              serverUrl: "{{ .internalFrontProxyUrl }}"
              resourceSchemaName: "v250704-6d57f16.contentconfigurations.ui.platform-mesh.io"
              resourceSchemaWorkspace: "root:platform-mesh-system"
        marketplace-ui:
          enabled: true
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: marketplace-ui
          values:
            contentConfig:
              baseDomain: '{{ .baseDomain }}'
              protocol: https
            exposure:
              hostnames:
              - "{{ .baseDomain }}"
              - "*.{{ .baseDomain }}"
            gatewayApi:
              enabled: true
            http:
              protocol: https
            istio:
              enabled: false
        terminal-controller-manager:
          enabled: false
          imageResources:
          - annotations:
              repo: oci
              artifact: image
              for: terminal-controller-manager
          - name: terminal-image
            annotations:
              path: terminal.image.tag
              for: terminal-controller-manager
              repo: oci
              artifact: image
            resource: terminal-image
            referencePath:
            - name: terminal-controller-manager
          values:
            kcp:
              kubeconfigSecret: terminal-controller-manager-kubeconfig
        observability:
          syncWave: 4
          enabled: false
          targetNamespace: observability
          imageResources:
          - name: otel-collector-image
            resource: otel-collector-image
            resourceName: otel-collector-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: otelCollector.image.tag
          - name: kubectl-image
            resource: kubectl-image
            resourceName: kubectl-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: serviceMonitors.kcp.certExtractor.image.tag
          - name: prometheus-server-image
            resource: prometheus-server-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: prometheus.server.image.tag
              image-ref: combined
          - name: prometheus-config-reloader-image
            resource: prometheus-config-reloader-image
            annotations:
              repo: oci
              artifact: image
              for: observability
              path: prometheus.configmapReload.prometheus.image.tag
              image-ref: combined
          dependsOn:
          - name: prometheus-operator-crds
            namespace: platform-mesh-system
          - name: opentelemetry-operator
            namespace: platform-mesh-system
          values:
            prometheus:
              server:
                persistentVolume:
                  enabled: false
                extraFlags:
                - web.enable-remote-write-receiver
              alertmanager:
                enabled: false
              prometheus-node-exporter:
                enabled: false
              prometheus-pushgateway:
                enabled: false
              kube-state-metrics:
                enabled: false
      targetNamespace: platform-mesh-system
