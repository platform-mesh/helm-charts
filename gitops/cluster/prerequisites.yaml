apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-mesh-prerequisites
  namespace: flux-system
spec:
  interval: 5m
  path: ./gitops/prerequisites
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ocm-k8s-toolkit
      namespace: flux-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: platform-mesh-install
