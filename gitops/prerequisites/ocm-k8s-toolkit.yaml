apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ocm-k8s-toolkit
  namespace: flux-system
spec:
  interval: 5m
  url: oci://ghcr.io/open-component-model/kubernetes/controller/chart
  ref:
    tag: "0.13.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocm-k8s-toolkit
  namespace: flux-system
spec:
  interval: 5m
  timeout: 15m
  releaseName: ocm-k8s-toolkit
  targetNamespace: ocm-system
  chartRef:
    kind: OCIRepository
    name: ocm-k8s-toolkit
  install:
    remediation:
      retries: -1
  values:
    manager:
      concurrency:
        resource: 3
