name: Renovate Autofix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - 'charts/**'

permissions:
  contents: read

concurrency:
  group: renovate-autofix-${{ github.event.pull_request.number }}
  # Don't cancel - pushing retriggers this workflow, which then could cancel before the approve was executed.
  cancel-in-progress: false

# When renovate makes pull requests it also updates version in the helm charts.
# Changes in the helm charts require updating e.g. the READMEs, otherwise the CI gate blocks.

jobs:
  autofix:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # The branch, not the head sha: the regenerated docs are pushed onto it.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # `task docs` runs Taskfile and templates from the PR branch; keep push credentials out of .git/config.
          persist-credentials: false
      - name: Configure git
        run: |
          git config --global user.name "Platform Mesh Publisher[bot]"
          git config --global user.email "platformmesh@gmail.com"

      - name: Regenerate chart docs
        id: docs
        run: |
          set -euo pipefail
          task docs

          git add 'charts/**/README.md'
          if git diff --cached --quiet; then
            echo "Chart docs already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -s -m "Regenerate chart docs"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: "1415820"
          private-key: ${{ secrets.PM_PUBLISHER_PRIVATE_KEY }}
          permission-contents: write
      - name: Push
        id: push
        if: success() && steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # No force push: the branch belongs to Renovate and a concurrent push must not be discarded.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: approver-app-token
        with:
          app-id: "4247305"
          private-key: ${{ secrets.PM_APPROVER_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Approve PR
        if: success() && steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.approver-app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail

          # Wait until the PR head matches the commit that was just pushed
          for _ in $(seq 30); do
            head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')
            if [ "$head" = "$SHA" ]; then
              break
            fi
            sleep 2
          done

          # Skip approving if the head never moved to the pushed commit
          if [ "$head" != "$SHA" ]; then
            echo "::warning::PR head is $head, not the pushed $SHA"
            exit 1
          fi

          # Still pinning approval to the pushed commit, just in case.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" -f "commit_id=${SHA}" -f 'event=APPROVE'
