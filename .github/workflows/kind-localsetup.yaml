# Installs Platform Mesh on a local KIND cluster using the declarative
# installation procedure (installation/README.md) and runs the portal e2e
# smoke test. Replaces the deleted development/ local-build workflow.
#
# The final job is named `kind-localsetup` and is the required status check;
# do not rename it.
name: kind-localsetup
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  checkout-and-detect-changes:
    runs-on: ubuntu-latest
    outputs:
      local_setup_changed: ${{ steps.local_setup.outputs.changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Did relevant paths change?
        id: local_setup
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          base="${BASE_REF#refs/heads/}"
          if
            git diff --quiet "origin/${base}" -- \
              charts \
              tests \
              .ocm \
              Taskfile.yaml \
              hack/ocm \
              .github/workflows/kind-localsetup.yaml \
              ':(exclude)**/*.md' \
              ':(exclude)**/README.md.gotmpl'
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  kind-localsetup-skip:
    needs: checkout-and-detect-changes
    if: needs.checkout-and-detect-changes.outputs.local_setup_changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip — local-setup unchanged
        run: echo "local-setup unchanged, skipping kind-localsetup"

  kind-localsetup-run:
    needs: checkout-and-detect-changes
    if: needs.checkout-and-detect-changes.outputs.local_setup_changed == 'true'
    runs-on: ubuntu-latest-large
    permissions:
      contents: read
      packages: read
    env:
      # kind cluster, base domain and ports follow installation/README.md (Kind).
      PM_VERSION: 0.6.0-build.6
      BASE_DOMAIN: portal.localhost
      PORTAL_BASE_URL: https://portal.localhost:8443/
      KEYCLOAK_BASE_URL: https://portal.localhost:8443/keycloak

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install the gh cli
        uses: ksivamuthu/actions-setup-gh-cli@c78dbed4be2f8d6133a14a9a597ee12fd4ed5c93 # v3
        with:
          version: 2.24.3

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.44.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Install kubectl kcp plugins
        run: |
          set -e
          ( set -x; cd "$(mktemp -d)" && curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/krew-linux_amd64.tar.gz" && tar zxvf krew-linux_amd64.tar.gz && KREW_ROOT="$HOME/.krew" ./krew-linux_amd64 install krew )
          echo "$HOME/.krew/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.krew/bin:$PATH"
          kubectl krew index add kcp-dev https://github.com/kcp-dev/krew-index.git
          kubectl krew install kcp-dev/kcp
          kubectl krew install kcp-dev/ws
          kubectl krew install kcp-dev/create-workspace
          kubectl krew install oidc-login

      - name: Install kind
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install -m 0755 ./kind /usr/local/bin/kind
          rm -f ./kind
          kind version

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/package-lock.json') }}

      - name: Create kind cluster
        run: |
          kind create cluster --name platform-mesh --image kindest/node:v1.35.1 --config=- <<'EOF'
          apiVersion: kind.x-k8s.io/v1alpha4
          kind: Cluster
          networking:
            apiServerAddress: "127.0.0.1"
            kubeProxyMode: iptables
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 31000
                  hostPort: 8443
                  protocol: TCP
                  listenAddress: "127.0.0.1"
          EOF
          kubectl cluster-info --context kind-platform-mesh

      - name: Log in to ghcr.io for Helm
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Add /etc/hosts entries
        run: |
          # The e2e runs on the runner: kubectl hits kcp.api.portal.localhost and
          # the browser navigates portal.localhost + the dynamic org subdomain.
          # /etc/hosts has no wildcards, so pin TEST_RUN_ID to make the org host
          # deterministic (matches constants.ts, which uses the last 8 chars).
          # Maintainer note: a true wildcard needs dnsmasq (address=/localhost/127.0.0.1).
          run_id="${GITHUB_RUN_ID}"
          run_id="${run_id: -8}"
          echo "TEST_RUN_ID=${run_id}" >> "$GITHUB_ENV"
          sudo tee -a /etc/hosts >/dev/null <<EOF
          127.0.0.1 portal.localhost
          127.0.0.1 kcp.api.portal.localhost
          127.0.0.1 root.kcp.portal.localhost
          127.0.0.1 org-root-${run_id}.portal.localhost
          EOF

      - name: Install prerequisites (pass 1 — controllers and CRDs)
        run: |
          # Reduce CPU requests for components with hard defaults so the
          # security-operator pods have room to schedule on the 4-vCPU runner.
          helm upgrade --install platform-mesh-prerequisites \
            ./charts/platform-mesh-prerequisites \
            --namespace platform-mesh-system \
            --set keycloak-operator.watchNamespaces=platform-mesh-system \
            --set keycloak-operator.resources.requests.cpu=100m \
            --set flux2.helmController.resources.requests.cpu=50m \
            --set flux2.kustomizeController.resources.requests.cpu=50m \
            --set flux2.sourceController.resources.requests.cpu=50m \
            --set flux2.notificationController.resources.requests.cpu=50m \
            --set flux2.imageAutomationController.create=false \
            --set flux2.imageReflectionController.create=false \
            --set ocm-k8s-toolkit.resources.requests.cpu=50m \
            --set etcd-druid.resources.requests.cpu=25m \
            --create-namespace \
            --wait \
            --timeout 15m

      - name: Install prerequisites (pass 2 — enable Traefik NodePort)
        run: |
          helm upgrade platform-mesh-prerequisites \
            ./charts/platform-mesh-prerequisites \
            --namespace platform-mesh-system \
            --reset-values \
            --wait \
            --timeout 15m \
            --set keycloak-operator.watchNamespaces=platform-mesh-system \
            --set keycloak-operator.resources.requests.cpu=100m \
            --set flux2.helmController.resources.requests.cpu=50m \
            --set flux2.kustomizeController.resources.requests.cpu=50m \
            --set flux2.sourceController.resources.requests.cpu=50m \
            --set flux2.notificationController.resources.requests.cpu=50m \
            --set flux2.imageAutomationController.create=false \
            --set flux2.imageReflectionController.create=false \
            --set ocm-k8s-toolkit.resources.requests.cpu=50m \
            --set etcd-druid.resources.requests.cpu=25m \
            --set traefik.enabled=true \
            --set traefik.service.type=NodePort \
            --set traefik.service.spec.type=NodePort \
            --set traefik.service.spec.clusterIP=10.96.188.4 \
            --set traefik.ports.websecure.exposedPort=8443 \
            --set traefik.ports.websecure.nodePort=31000

      - name: Capture Traefik ClusterIP
        id: traefik
        run: |
          ip=$(kubectl --namespace platform-mesh-system \
            get service platform-mesh-prerequisites-traefik \
            --output jsonpath='{.spec.clusterIP}')
          echo "cluster_ip=${ip}" >> "$GITHUB_OUTPUT"
          echo "Traefik ClusterIP: ${ip}"

      - name: Install platform-mesh-operator (kind profile)
        run: |
          # hostAliases is intentionally not set: the operator reaches
          # kcp via the in-cluster front-proxy Service, and component pods get their
          # host aliases from the kind profile keyed on gateway.traefikClusterIP.
          #
          # No --wait here: the chart applies the PlatformMesh resource, then the
          # dedicated "Wait for Platform Mesh" step gates readiness with a 30m budget.
          # (Helm v4 --wait tracks custom-resource readiness, so a short --wait would
          # time out on a cold KIND before the platform finishes reconciling.)
          helm upgrade --install platform-mesh-operator \
            ./charts/platform-mesh-operator \
            --namespace platform-mesh-system \
            --set ocm.enabled=true \
            --set ocm.profile=kind \
            --set gateway.baseDomain="${BASE_DOMAIN}" \
            --set gateway.port=8443 \
            --set gateway.traefikClusterIP="${{ steps.traefik.outputs.cluster_ip }}" \
            --set kcp.frontProxyPort=8443 \
            --set certificates.selfSigned.enabled=true \
            --set-string ocm.version="${PM_VERSION}"

      - name: Wait for Platform Mesh to become ready
        run: |
          kubectl wait --namespace platform-mesh-system \
            --for=condition=Ready platformmeshes/platform-mesh \
            --timeout=30m

      - name: Regenerate kcp admin kubeconfig
        # Run from the repo root so the kubeconfig lands at <repo>/.secret/kcp/admin.kubeconfig,
        # which is exactly the ADMIN_KUBECONFIG the e2e resolves (tests/..). The admin client
        # cert is rotated on every install, so this must run after the operator is Ready.
        run: ./tests/create-kcp-admin-kubeconfig.sh

      - name: Run portal e2e (root-shard smoke)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Give the workspace initializer more time on a single-node KIND cluster —
          # nereus/triton shards compete for CPU, making workspace provisioning slower
          # than on dedicated hardware.
          ORG_READY_TIMEOUT_SECONDS: "600"
        run: task test:portal-e2e:remote TEST_RUN_ID="${TEST_RUN_ID}"

      - name: Dump cluster diagnostics
        if: failure()
        run: |
          mkdir -p runtime-artifacts
          kubectl get platformmesh -n platform-mesh-system -o yaml > runtime-artifacts/platformmesh.yaml 2>&1 || true
          kubectl describe platformmesh platform-mesh -n platform-mesh-system > runtime-artifacts/platformmesh-describe.txt 2>&1 || true
          kubectl get pods -A -o wide > runtime-artifacts/pods.txt 2>&1 || true
          kubectl describe node > runtime-artifacts/node-describe.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > runtime-artifacts/events.txt 2>&1 || true
          kubectl get helmreleases,ocirepositories -A > runtime-artifacts/flux.txt 2>&1 || true
          for p in $(kubectl get pods -n platform-mesh-system -o name 2>/dev/null); do
            safe="${p//\//_}"
            kubectl logs -n platform-mesh-system "$p" --all-containers --tail=500 > "runtime-artifacts/platform-mesh-system_${safe}.log" 2>&1 || true
          done

      - name: Upload runtime artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-artifacts
          path: |
            runtime-artifacts/
          retention-days: 5

      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-artifacts
          path: |
            tests/test-results/
            tests/*.png
          retention-days: 5

  kind-localsetup:
    if: always()
    needs: [kind-localsetup-skip, kind-localsetup-run]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.kind-localsetup-run.result }}" == "failure" || "${{ needs.kind-localsetup-run.result }}" == "cancelled" ]]; then
            exit 1
          fi
