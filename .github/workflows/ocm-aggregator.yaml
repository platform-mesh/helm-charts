name: Build Platform Mesh OCM Component (aggregator)
on:
  workflow_call:
    inputs:
      force_version_upgrade:
        required: false
        default: false
        type: boolean
      version_increment:
        required: false
        default: "none"
        type: string
      release_type:
        required: false
        default: "build"
        type: string
  workflow_dispatch:
    inputs:
      force_version_upgrade:
        description: "Force version upgrade even without dependency changes"
        required: false
        default: false
        type: boolean
      version_increment:
        description: "Version component to increment (only applies when force_version_upgrade is true, use none to keep version and only change release type)"
        required: false
        default: "minor"
        type: choice
        options:
          - none
          - minor
          - major
          - patch
      release_type:
        description: "Type of release to create (only applies when force_version_upgrade is true)"
        required: false
        default: "build"
        type: choice
        options:
          - build
          - rc
          - full
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ocm-aggregator.yaml"
      - ".ocm/component-constructor-aggregate.yaml"
permissions:
  contents: read

concurrency:
  group: ocm-aggregator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ocm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Third-party dependency versions
      KCP_OPERATOR_CHART_VERSION: "0.7.4"
      KCP_OPERATOR_IMAGE_VERSION: "v0.8.0"
      KCP_VERSION: "v0.32.2"
      INIT_AGENT_CHART_VERSION: "0.2.0"
      INIT_AGENT_IMAGE_VERSION: "v0.2.0"
      API_SYNCAGENT_CHART_VERSION: "0.6.1"
      API_SYNCAGENT_IMAGE_VERSION: "v0.7.0"
      API_SYNCAGENT_COMPONENT_VERSION: "1.0.0"
      OPENFGA_VERSION: "0.2.62"
      OPENFGA_IMAGE_VERSION: "v1.14.0"
      OPENFGA_POSTGRESQL_IMAGE_VERSION: "17.9.0-debian-12-r3"
      GATEWAY_API_CHART_VERSION: "1.4.2"
      TRAEFIK_VERSION: "39.0.8"
      TRAEFIK_CHART_VERSION: "39.0.7"
      TRAEFIK_IMAGE_VERSION: "v3.6.13"
      TRAEFIK_CRD_VERSION: "1.14.0"
      CERT_MANAGER_VERSION: "v1.20.1"
      CNPG_OPERATOR_CHART_VERSION: "0.28.0"
      CNPG_OPERATOR_IMAGE_VERSION: "1.29.0"
      PROMETHEUS_OPERATOR_CRDS_VERSION: "29.0.0"
      KUBE_PROMETHEUS_STACK_VERSION: "27.0.0"
      # renovate: datasource=docker depName=europe-docker.pkg.dev/gardener-project/releases/component-descriptors/github.com/gardener/etcd-druid
      GARDENER_ETCD_DRUID_VERSION: "v0.36.4"
      # renovate: datasource=docker depName=ghcr.io/platform-mesh/component-descriptors/github.com/platform-mesh/keycloak
      PM_KEYCLOAK_VERSION: "26.6.0"
      # PM-stamped component descriptor versions for third-party components.
      # Bump these to publish a new descriptor without touching resource versions. If resource
      # versions change, make sure to bump those as well.
      PM_TRAEFIK_VERSION: "0.0.1"
      PM_CERT_MANAGER_VERSION: "0.0.1"
      PM_OPENFGA_VERSION: "0.0.1"
      PM_KCP_OPERATOR_VERSION: "0.0.1"
      PM_KCP_VERSION: "0.0.3"
      PM_INIT_AGENT_VERSION: "0.0.1"
      PM_CNPG_OPERATOR_VERSION: "0.0.1"
      PM_PROMETHEUS_OPERATOR_CRDS_VERSION: "0.0.1"
      PM_KUBE_PROMETHEUS_STACK_VERSION: "0.0.1"
      PM_OPENTELEMETRY_OPERATOR_VERSION: "0.0.2"
      OPENTELEMETRY_OPERATOR_VERSION: "0.114.1"
      OTEL_OPERATOR_IMAGE_VERSION: "0.152.0"
      OTEL_COLLECTOR_IMAGE_VERSION: "0.152.1"
      OTEL_TARGET_ALLOCATOR_VERSION: "0.152.0"
    steps:
      - name: Setup yq@latest
        run: |
          if ! command -v yq &>/dev/null
          then
            mkdir -p /home/runner/.local/bin
            wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /home/runner/.local/bin/yq &&\
              chmod +x /home/runner/.local/bin/yq
          fi
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: setup OCM CLI
        run: |
          REPO=${repo:=open-component-model/open-component-model}
          if [ -z "$version" -o "$version" == latest ]; then
            version="$(basename "$(curl -Ls -o /dev/null -w %{url_effective} https://github.com/$REPO/releases/latest)")"
            echo "Selecting latest version: $version"
          fi
          echo "Installing ocm-cli version $version from $REPO"
          curl -LsS -o ocm "https://github.com/$REPO/releases/download/${version}/ocm-linux-amd64"
          chmod a+x ocm
      - name: Write Credentials file
        run: |
          cat <<EOF > $HOME/.ocmconfig
          type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software
              consumers:
                - identity:
                    type: OCIRegistry
                    scheme: https
                    hostname: ghcr.io
                    path: platform-mesh
                  credentials:
                    - type: Credentials
                      properties:
                        username: github
                        password: ${{ secrets.GITHUB_TOKEN }}
                - identity:
                    type: OCIRegistry
                    scheme: https
                    hostname: registry-1.docker.io
                  credentials:
                    - type: Credentials
                      properties:
                        username: ${{ secrets.DOCKERHUB_USERNAME }}
                        password: ${{ secrets.DOCKERHUB_TOKEN }}
          EOF
      - name: Get versions
        run: |
          set -e
          # Versions that can be resolved from working tree
          echo ACCOUNT_OPERATOR_VERSION=$(yq '.version' charts/account-operator/Chart.yaml) >> $GITHUB_ENV
          echo SECURITY_OPERATOR_VERSION=$(yq '.version' charts/security-operator/Chart.yaml) >> $GITHUB_ENV
          echo EXTENSION_MANAGER_OPERATOR_VERSION=$(yq '.version' charts/extension-manager-operator/Chart.yaml) >> $GITHUB_ENV
          echo INFRA_VERSION=$(yq '.version' charts/infra/Chart.yaml) >> $GITHUB_ENV
          echo REBAC_AUTHZ_WEBHOOK_VERSION=$(yq '.version' charts/rebac-authz-webhook/Chart.yaml) >> $GITHUB_ENV
          echo PORTAL_VERSION=$(yq '.version' charts/portal/Chart.yaml) >> $GITHUB_ENV
          echo PLATFORM_MESH_OPERATOR_VERSION=$(yq '.version' charts/platform-mesh-operator/Chart.yaml) >> $GITHUB_ENV
          echo KUBERNETES_GRAPHQL_GATEWAY_VERSION=$(yq '.version' charts/kubernetes-graphql-gateway/Chart.yaml) >> $GITHUB_ENV
          echo VIRTUAL_WORKSPACES_VERSION=$(yq '.version' charts/virtual-workspaces/Chart.yaml) >> $GITHUB_ENV
          echo EXAMPLE_HTTPBIN_OPERATOR_VERSION=$(yq '.version' charts/example-httpbin-operator/Chart.yaml) >> $GITHUB_ENV
          echo KRO_COMPOSITION_OPERATOR_VERSION=$(yq '.version' charts/kro-composition-operator/Chart.yaml) >> $GITHUB_ENV
          echo IAM_SERVICE_VERSION=$(yq '.version' charts/iam-service/Chart.yaml) >> $GITHUB_ENV
          echo IAM_UI_VERSION=$(yq '.version' charts/iam-ui/Chart.yaml) >> $GITHUB_ENV
          echo MARKETPLACE_UI_VERSION=$(yq '.version' charts/marketplace-ui/Chart.yaml) >> $GITHUB_ENV
          echo TERMINAL_CONTROLLER_MANAGER_VERSION=$(yq '.version' charts/terminal-controller-manager/Chart.yaml) >> $GITHUB_ENV
          echo KEYCLOAK_OPERATOR_VERSION=$(yq '.version' charts/keycloak-operator/Chart.yaml) >> $GITHUB_ENV
          echo OBSERVABILITY_VERSION=$(yq '.version' charts/observability/Chart.yaml) >> $GITHUB_ENV

          # KEYCLOAK_VERSION (the platform-mesh keycloak component descriptor) tracks PM_KEYCLOAK_VERSION above.
          echo KEYCLOAK_VERSION=${PM_KEYCLOAK_VERSION} >> $GITHUB_ENV

          # Get current platform-mesh version
          PM_VERSION=$(./ocm get componentversions --latest ghcr.io/platform-mesh//github.com/platform-mesh/platform-mesh -o json | jq -r '.[0].component.version')
          PM_VERSION=${PM_VERSION:-0.0.0}
          echo CURRENT_PM_VERSION="$PM_VERSION" >> $GITHUB_ENV

          # Calculate next version for potential use with release logic
          # Check if force upgrade is requested with specific version increment
          if [ "${{ inputs.force_version_upgrade }}" = "true" ]; then
            # Check if current version has a prerelease suffix and we want to promote to full release
            if [[ "$PM_VERSION" =~ -(build|rc)\.([0-9]+)$ ]] && [ "${{ inputs.release_type }}" = "full" ]; then
              # Promote prerelease to full release by stripping suffix
              NEXT_VERSION=${PM_VERSION%-*.*}
            else
              # Strip prerelease suffix if present to get base version for incrementing
              BASE_VERSION=${PM_VERSION%-*.*}
              IFS='.' read -r major minor patch <<< "$BASE_VERSION"
              case "${{ inputs.version_increment }}" in
                "none")
                  # Keep base version, only change release type
                  if [ "${{ inputs.release_type }}" = "full" ]; then
                    NEXT_VERSION="$major.$minor.$patch"
                  elif [ "${{ inputs.release_type }}" = "rc" ]; then
                    if [[ "$PM_VERSION" =~ -rc\.([0-9]+)$ ]]; then
                      NEXT_VERSION="$major.$minor.$patch-rc.$(( ${BASH_REMATCH[1]} + 1 ))"
                    else
                      NEXT_VERSION="$major.$minor.$patch-rc.1"
                    fi
                  else
                    if [[ "$PM_VERSION" =~ -build\.([0-9]+)$ ]]; then
                      NEXT_VERSION="$major.$minor.$patch-build.$(( ${BASH_REMATCH[1]} + 1 ))"
                    else
                      NEXT_VERSION="$major.$minor.$patch-build.1"
                    fi
                  fi
                  ;;
                "major")
                  major=$((major + 1))
                  if [ "${{ inputs.release_type }}" = "full" ]; then
                    NEXT_VERSION="$major.0.0"
                  elif [ "${{ inputs.release_type }}" = "rc" ]; then
                    NEXT_VERSION="$major.0.0-rc.1"
                  else
                    NEXT_VERSION="$major.0.0-build.1"
                  fi
                  ;;
                "minor")
                  minor=$((minor + 1))
                  if [ "${{ inputs.release_type }}" = "full" ]; then
                    NEXT_VERSION="$major.$minor.0"
                  elif [ "${{ inputs.release_type }}" = "rc" ]; then
                    NEXT_VERSION="$major.$minor.0-rc.1"
                  else
                    NEXT_VERSION="$major.$minor.0-build.1"
                  fi
                  ;;
                "patch")
                  patch=$((patch + 1))
                  if [ "${{ inputs.release_type }}" = "full" ]; then
                    NEXT_VERSION="$major.$minor.$patch"
                  elif [ "${{ inputs.release_type }}" = "rc" ]; then
                    NEXT_VERSION="$major.$minor.$patch-rc.1"
                  else
                    NEXT_VERSION="$major.$minor.$patch-build.1"
                  fi
                  ;;
                *)
                  # Default to minor increment
                  minor=$((minor + 1))
                  if [ "${{ inputs.release_type }}" = "full" ]; then
                    NEXT_VERSION="$major.$minor.0"
                  elif [ "${{ inputs.release_type }}" = "rc" ]; then
                    NEXT_VERSION="$major.$minor.0-rc.1"
                  else
                    NEXT_VERSION="$major.$minor.0-build.1"
                  fi
                  ;;
              esac
            fi
          elif [[ "$PM_VERSION" =~ -build\.([0-9]+)$ ]]; then
            # Current version is already a build release, increment the build number
            BUILD_NUM=${BASH_REMATCH[1]}
            NEW_BUILD_NUM=$((BUILD_NUM + 1))
            BASE_VERSION=${PM_VERSION%-build.*}
            NEXT_VERSION="$BASE_VERSION-build.$NEW_BUILD_NUM"
          elif [[ "$PM_VERSION" =~ -rc\.([0-9]+)$ ]]; then
            # Current version is already a release candidate, increment the rc number
            RC_NUM=${BASH_REMATCH[1]}
            NEW_RC_NUM=$((RC_NUM + 1))
            BASE_VERSION=${PM_VERSION%-rc.*}
            NEXT_VERSION="$BASE_VERSION-rc.$NEW_RC_NUM"
          else
            # Default behavior: increment minor version and add -build.1
            IFS='.' read -r major minor patch <<< "$PM_VERSION"
            minor=$((minor + 1))
            NEXT_VERSION="$major.$minor.0-build.1"
          fi
          echo NEXT_VERSION="$NEXT_VERSION" >> $GITHUB_ENV

      - name: Check if version update needed
        id: version_check
        run: |
          set -e

          # Get the latest platform-mesh component descriptor to compare dependencies
          ./ocm get component-version --latest ghcr.io/platform-mesh//github.com/platform-mesh/platform-mesh -o yaml \
            | yq eval '.[0]' - > current_pm_component.yaml \
            || echo "No existing platform-mesh component found"

          # Extract current dependency versions from the existing component (if it exists)
          if [ -f current_pm_component.yaml ] && [ -s current_pm_component.yaml ]; then
            CURRENT_ACCOUNT_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "account-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_SECURITY_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "security-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_EXTENSION_MANAGER_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "extension-manager-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_INFRA=$(yq eval '.component.componentReferences[] | select(.name == "infra") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_REBAC_AUTHZ_WEBHOOK=$(yq eval '.component.componentReferences[] | select(.name == "rebac-authz-webhook") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_PORTAL=$(yq eval '.component.componentReferences[] | select(.name == "portal") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_PLATFORM_MESH_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "platform-mesh-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_KEYCLOAK=$(yq eval '.component.componentReferences[] | select(.name == "keycloak") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_KUBERNETES_GRAPHQL_GATEWAY=$(yq eval '.component.componentReferences[] | select(.name == "kubernetes-graphql-gateway") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_VIRTUAL_WORKSPACES=$(yq eval '.component.componentReferences[] | select(.name == "virtual-workspaces") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_EXAMPLE_HTTPBIN_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "example-httpbin-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_IAM_SERVICE=$(yq eval '.component.componentReferences[] | select(.name == "iam-service") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_IAM_UI=$(yq eval '.component.componentReferences[] | select(.name == "iam-ui") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_MARKETPLACE_UI=$(yq eval '.component.componentReferences[] | select(.name == "marketplace-ui") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_TERMINAL_CONTROLLER_MANAGER=$(yq eval '.component.componentReferences[] | select(.name == "terminal-controller-manager") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_KEYCLOAK_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "keycloak-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_OBSERVABILITY=$(yq eval '.component.componentReferences[] | select(.name == "observability") | .version' current_pm_component.yaml 2>/dev/null || echo "")

            # Extract third-party dependency versions
            CURRENT_ISTIO=$(yq eval '.component.componentReferences[] | select(.name == "istio-base") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_KCP_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "kcp-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_INIT_AGENT=$(yq eval '.component.componentReferences[] | select(.name == "init-agent") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_KCP=$(yq eval '.component.componentReferences[] | select(.name == "kcp") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_ETCD_DRUID=$(yq eval '.component.componentReferences[] | select(.name == "etcd-druid") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_OPENFGA=$(yq eval '.component.componentReferences[] | select(.name == "openfga") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_GATEWAY_API=$(yq eval '.component.componentReferences[] | select(.name == "gateway-api-crds") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_TRAEFIK=$(yq eval '.component.componentReferences[] | select(.name == "traefik") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_CERT_MANAGER=$(yq eval '.component.componentReferences[] | select(.name == "cert-manager") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_CNPG_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "cnpg-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_PROMETHEUS_OPERATOR_CRDS=$(yq eval '.component.componentReferences[] | select(.name == "prometheus-operator-crds") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_KUBE_PROMETHEUS_STACK=$(yq eval '.component.componentReferences[] | select(.name == "kube-prometheus-stack") | .version' current_pm_component.yaml 2>/dev/null || echo "")
            CURRENT_OPENTELEMETRY_OPERATOR=$(yq eval '.component.componentReferences[] | select(.name == "opentelemetry-operator") | .version' current_pm_component.yaml 2>/dev/null || echo "")
          else
            # No existing component, so we need to create one
            echo "No existing platform-mesh component found, creating initial version"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "VERSION=${{ env.NEXT_VERSION }}" >> $GITHUB_ENV
            exit 0
          fi

          # Check if force upgrade is requested
          if [ "${{ inputs.force_version_upgrade }}" = "true" ]; then
            echo "Force version upgrade requested, creating new version"
            echo "Previous platform-mesh version: ${{ env.CURRENT_PM_VERSION }}"
            echo "New platform-mesh version: ${{ env.NEXT_VERSION }}"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "VERSION=${{ env.NEXT_VERSION }}" >> $GITHUB_ENV
            exit 0
          fi

          # Compare versions to detect changes
          NEEDS_UPDATE=false

          if [ "$CURRENT_ACCOUNT_OPERATOR" != "${{ env.ACCOUNT_OPERATOR_VERSION }}" ]; then
            echo "Account operator: $CURRENT_ACCOUNT_OPERATOR -> ${{ env.ACCOUNT_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_SECURITY_OPERATOR" != "${{ env.SECURITY_OPERATOR_VERSION }}" ]; then
            echo "Security operator: $CURRENT_SECURITY_OPERATOR -> ${{ env.SECURITY_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_EXTENSION_MANAGER_OPERATOR" != "${{ env.EXTENSION_MANAGER_OPERATOR_VERSION }}" ]; then
            echo "Extension manager operator: $CURRENT_EXTENSION_MANAGER_OPERATOR -> ${{ env.EXTENSION_MANAGER_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_INFRA" != "${{ env.INFRA_VERSION }}" ]; then
            echo "Infra: $CURRENT_INFRA -> ${{ env.INFRA_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_REBAC_AUTHZ_WEBHOOK" != "${{ env.REBAC_AUTHZ_WEBHOOK_VERSION }}" ]; then
            echo "Rebac authz webhook: $CURRENT_REBAC_AUTHZ_WEBHOOK -> ${{ env.REBAC_AUTHZ_WEBHOOK_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_PORTAL" != "${{ env.PORTAL_VERSION }}" ]; then
            echo "Portal: $CURRENT_PORTAL -> ${{ env.PORTAL_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_PLATFORM_MESH_OPERATOR" != "${{ env.PLATFORM_MESH_OPERATOR_VERSION }}" ]; then
            echo "Platform mesh operator: $CURRENT_PLATFORM_MESH_OPERATOR -> ${{ env.PLATFORM_MESH_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_KEYCLOAK_OPERATOR" != "${{ env.KEYCLOAK_OPERATOR_VERSION }}" ]; then
            echo "Keycloak operator: $CURRENT_KEYCLOAK_OPERATOR -> ${{ env.KEYCLOAK_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_KEYCLOAK" != "${{ env.PM_KEYCLOAK_VERSION }}" ]; then
            echo "Keycloak: $CURRENT_KEYCLOAK -> ${{ env.PM_KEYCLOAK_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_KUBERNETES_GRAPHQL_GATEWAY" != "${{ env.KUBERNETES_GRAPHQL_GATEWAY_VERSION }}" ]; then
            echo "Kubernetes GraphQL gateway: $CURRENT_KUBERNETES_GRAPHQL_GATEWAY -> ${{ env.KUBERNETES_GRAPHQL_GATEWAY_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_VIRTUAL_WORKSPACES" != "${{ env.VIRTUAL_WORKSPACES_VERSION }}" ]; then
            echo "Virtual workspaces: $CURRENT_VIRTUAL_WORKSPACES -> ${{ env.VIRTUAL_WORKSPACES_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_EXAMPLE_HTTPBIN_OPERATOR" != "${{ env.EXAMPLE_HTTPBIN_OPERATOR_VERSION }}" ]; then
            echo "Example HTTPBin operator: $CURRENT_EXAMPLE_HTTPBIN_OPERATOR -> ${{ env.EXAMPLE_HTTPBIN_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_IAM_SERVICE" != "${{ env.IAM_SERVICE_VERSION }}" ]; then
            echo "IAM service: $CURRENT_IAM_SERVICE -> ${{ env.IAM_SERVICE_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_IAM_UI" != "${{ env.IAM_UI_VERSION }}" ]; then
            echo "IAM UI: $CURRENT_IAM_UI -> ${{ env.IAM_UI_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_MARKETPLACE_UI" != "${{ env.MARKETPLACE_UI_VERSION }}" ]; then
            echo "Marketplace UI: $CURRENT_MARKETPLACE_UI -> ${{ env.MARKETPLACE_UI_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_TERMINAL_CONTROLLER_MANAGER" != "${{ env.TERMINAL_CONTROLLER_MANAGER_VERSION }}" ]; then
            echo "Terminal controller manager: $CURRENT_TERMINAL_CONTROLLER_MANAGER -> ${{ env.TERMINAL_CONTROLLER_MANAGER_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_OBSERVABILITY" != "${{ env.OBSERVABILITY_VERSION }}" ]; then
            echo "Observability: $CURRENT_OBSERVABILITY -> ${{ env.OBSERVABILITY_VERSION }}"
            NEEDS_UPDATE=true
          fi

          # Check third-party dependency versions. Third-party component descriptors are
          # published with PM-stamped versions (PM_* env vars above), independent of the
          # upstream resource versions, so compare against the PM-stamped value.
          if [ "$CURRENT_KCP_OPERATOR" != "${{ env.PM_KCP_OPERATOR_VERSION }}" ]; then
            echo "KCP Operator: $CURRENT_KCP_OPERATOR -> ${{ env.PM_KCP_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_KCP" != "${{ env.PM_KCP_VERSION }}" ]; then
            echo "KCP: $CURRENT_KCP -> ${{ env.PM_KCP_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_INIT_AGENT" != "${{ env.PM_INIT_AGENT_VERSION }}" ]; then
            echo "Init Agent: $CURRENT_INIT_AGENT -> ${{ env.PM_INIT_AGENT_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_ETCD_DRUID" != "${{ env.GARDENER_ETCD_DRUID_VERSION }}" ]; then
            echo "Gardener etcd-druid: $CURRENT_ETCD_DRUID -> ${{ env.GARDENER_ETCD_DRUID_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_OPENFGA" != "${{ env.PM_OPENFGA_VERSION }}" ]; then
            echo "OpenFGA: $CURRENT_OPENFGA -> ${{ env.PM_OPENFGA_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_GATEWAY_API" != "${{ env.GATEWAY_API_CHART_VERSION }}" ]; then
            echo "Gateway API: $CURRENT_GATEWAY_API -> ${{ env.GATEWAY_API_CHART_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_TRAEFIK" != "${{ env.PM_TRAEFIK_VERSION }}" ]; then
            echo "Traefik: $CURRENT_TRAEFIK -> ${{ env.PM_TRAEFIK_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_CERT_MANAGER" != "${{ env.PM_CERT_MANAGER_VERSION }}" ]; then
            echo "Cert Manager: $CURRENT_CERT_MANAGER -> ${{ env.PM_CERT_MANAGER_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_CNPG_OPERATOR" != "${{ env.PM_CNPG_OPERATOR_VERSION }}" ]; then
            echo "CNPG Operator: $CURRENT_CNPG_OPERATOR -> ${{ env.PM_CNPG_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_PROMETHEUS_OPERATOR_CRDS" != "${{ env.PM_PROMETHEUS_OPERATOR_CRDS_VERSION }}" ]; then
            echo "Prometheus Operator CRDs: $CURRENT_PROMETHEUS_OPERATOR_CRDS -> ${{ env.PM_PROMETHEUS_OPERATOR_CRDS_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_KUBE_PROMETHEUS_STACK" != "${{ env.PM_KUBE_PROMETHEUS_STACK_VERSION }}" ]; then
            echo "Kube Prometheus Stack: $CURRENT_KUBE_PROMETHEUS_STACK -> ${{ env.PM_KUBE_PROMETHEUS_STACK_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$CURRENT_OPENTELEMETRY_OPERATOR" != "${{ env.PM_OPENTELEMETRY_OPERATOR_VERSION }}" ]; then
            echo "OpenTelemetry Operator: $CURRENT_OPENTELEMETRY_OPERATOR -> ${{ env.PM_OPENTELEMETRY_OPERATOR_VERSION }}"
            NEEDS_UPDATE=true
          fi

          if [ "$NEEDS_UPDATE" = "true" ]; then
            echo "Component dependencies have changed, creating new version"
            echo "Previous platform-mesh version: ${{ env.CURRENT_PM_VERSION }}"
            echo "New platform-mesh version: ${{ env.NEXT_VERSION }}"
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "VERSION=${{ env.NEXT_VERSION }}" >> $GITHUB_ENV
          else
            echo "No dependency changes detected, skipping component creation"
            echo "Current platform-mesh version: ${{ env.CURRENT_PM_VERSION }} (no update needed)"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Copy external component references to ghcr.io
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          ocm_target=ghcr.io/platform-mesh
          etcd_ref="github.com/gardener/etcd-druid:${{ env.GARDENER_ETCD_DRUID_VERSION }}"
          # Skip if etcd-druid is already in ghcr.io to avoid overwriting an existing version.
          if ./ocm get componentversion "$ocm_target//$etcd_ref" >/dev/null 2>&1; then
            echo "etcd-druid ${{ env.GARDENER_ETCD_DRUID_VERSION }} already present in ghcr.io, skipping transfer"
          else
            # etcd-druid v0.36.4 contains SPDX resources backed by a multi-manifest OCI index that
            # OCM v2 cannot re-pack (no top-level parent manifest). Generate a transfer spec, strip
            # the invalid nodes, and replay — the SPDX resources are omitted from the copy.
            ./ocm transfer component-version --copy-resources --recursive --dry-run -o yaml \
              "europe-docker.pkg.dev/gardener-project/releases//github.com/gardener/etcd-druid:${{ env.GARDENER_ETCD_DRUID_VERSION }}" \
              "$ocm_target" > /tmp/etcd-druid-transfer-spec.yaml
            python3 - << 'PYEOF'
          import yaml, sys
          with open('/tmp/etcd-druid-transfer-spec.yaml') as f:
              spec = yaml.safe_load(f)
          nodes = spec['transformations']
          spdx_ids = {n['id'] for n in nodes if 'Spdx' in n['id']}
          def strip_spdx(obj):
              if isinstance(obj, list):
                  return [strip_spdx(i) for i in obj if not (isinstance(i, str) and any(s in i for s in spdx_ids))]
              elif isinstance(obj, dict):
                  return {k: strip_spdx(v) for k, v in obj.items()}
              return obj
          filtered = [strip_spdx(n) for n in nodes if n['id'] not in spdx_ids]
          for n in filtered:
              if 'dependsOn' in n:
                  n['dependsOn'] = [d for d in n['dependsOn'] if d not in spdx_ids]
          spec['transformations'] = filtered
          with open('/tmp/etcd-druid-transfer-spec-nospdx.yaml', 'w') as f:
              yaml.dump(spec, f, default_flow_style=False)
          print(f"Stripped {len(spdx_ids)} SPDX nodes, {len(filtered)} nodes remaining", file=sys.stderr)
          PYEOF
            ./ocm transfer component-version --transfer-spec /tmp/etcd-druid-transfer-spec-nospdx.yaml
          fi

      - name: create OCM ComponentArchive
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          ./ocm add component-versions --repository "ghcr.io/platform-mesh" --constructor .ocm/component-constructor-aggregate.yaml

      - name: Sign OCM Component
        if: steps.version_check.outputs.needs_update == 'true'
        run: |
          cat >> $HOME/.ocmconfig << EOF
            - type: credentials.config.ocm.software
              consumers:
              - identity:
                  type: RSA/v1alpha1
                  algorithm: RSASSA-PSS
                  signature: helm-charts.platform-mesh
                credentials:
                - type: Credentials/v1
                  properties:
                    private_key_pem: |
          $(printf '%s' "$OCM_SIGNING_PRIVATE_KEY" | sed 's/^/            /')
                    public_key_pem: |
          $(printf '%s' "$OCM_SIGNING_CERT" | sed 's/^/            /')
          EOF
          ./ocm sign component-version --signature helm-charts.platform-mesh \
            "oci://ghcr.io/platform-mesh//github.com/platform-mesh/platform-mesh:${{ env.VERSION }}"
        env:
          OCM_SIGNING_PRIVATE_KEY: ${{ secrets.OCM_SIGNING_PRIVATE_KEY }}
          OCM_SIGNING_CERT: ${{ secrets.OCM_SIGNING_CERT }}
