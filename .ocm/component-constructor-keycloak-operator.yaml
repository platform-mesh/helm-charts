components:
  - name: ${COMPONENT_NAME}
    version: ${VERSION}
    provider:
      name: The Platform Mesh Team
    componentReferences:
      - name: chart
        componentName: github.com/platform-mesh/helm-charts/${COMPONENT_SHORT_NAME}
        version: ${VERSION}
      - name: image
        componentName: github.com/platform-mesh/images/${COMPONENT_SHORT_NAME}
        version: ${VERSION}
    sources:
      - name: chart
        type: git
        version: ${VERSION}
        access:
          commit: ${COMMIT}
          repoUrl: ${CHART_REPO}
          type: gitHub

  - name: github.com/platform-mesh/helm-charts/${COMPONENT_SHORT_NAME}
    version: ${VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: chart
        type: helmChart
        relation: external
        version: ${VERSION}
        access:
          type: ociArtifact
          imageReference: "${CHART_OCI_PATH}:${VERSION}"

  - name: github.com/platform-mesh/images/${COMPONENT_SHORT_NAME}
    version: ${VERSION}
    provider:
      name: The Platform Mesh Team
    resources:
      - name: keycloak-image
        type: ociImage
        relation: external
        version: "v26.7.2"
        access:
          type: ociArtifact
          imageReference: "ghcr.io/platform-mesh/custom-images/keycloak:v26.7.2@sha256:5feb71bdf548ee2f7ff33ba2eba082a94de5c16d1a50de8bca71ab78a89c986b"
      - name: manager-image
        type: ociImage
        relation: external
        version: "26.7.2"
        access:
          type: ociArtifact
          imageReference: "quay.io/keycloak/keycloak-operator:26.7.2"
