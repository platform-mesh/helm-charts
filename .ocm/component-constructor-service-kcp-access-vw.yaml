components:
  - name: "${COMPONENT_NAME}"
    version: "${VERSION}"
    provider:
      name: The Platform Mesh Team
    componentReferences:
      - name: chart
        componentName: "github.com/platform-mesh/helm-charts/${CHART_NAME}"
        version: "${VERSION}"
      - name: image
        componentName: "github.com/platform-mesh/images/${IMAGE_COMPONENT_NAME}"
        version: "${VERSION}"

  # The image is built and released by kcp-dev/contrib-virtual-workspaces;
  # this component only references it.
  - name: "github.com/platform-mesh/images/${IMAGE_COMPONENT_NAME}"
    version: "${VERSION}"
    provider:
      name: The Platform Mesh Team
    resources:
      - name: access-vw-image
        type: ociImage
        relation: external
        version: "0.1.1"
        access:
          type: ociArtifact
          imageReference: "ghcr.io/kcp-dev/contrib-virtual-workspaces/access-vw:0.1.1@sha256:2e84f6d28d949b8a55beae449b6a13af8fe13ecf324b03be15379993a0515e55"
