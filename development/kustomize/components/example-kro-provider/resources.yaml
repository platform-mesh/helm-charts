# OCM chart + image Resources for the kro-composition-operator, resolved from the
# `platform-mesh` OCM component. The platform-mesh-operator watches these Resources:
# the chart drives the flux OCIRepository the HelmRelease references, and the image
# is localized for the workload.
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: chart
    repo: oci
  name: kro-composition-operator-chart
  namespace: platform-mesh-system
spec:
  componentRef:
    name: platform-mesh
  ocmConfig:
  - apiVersion: delivery.ocm.software/v1alpha1
    kind: Repository
    name: platform-mesh
    namespace: platform-mesh-system
    policy: Propagate
  resource:
    byReference:
      referencePath:
      - name: kro-composition-operator
      - name: chart
      resource:
        name: chart
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: image
    for: example-kro-provider
  name: kro-composition-operator-image
  namespace: platform-mesh-system
spec:
  componentRef:
    name: platform-mesh
  ocmConfig:
  - apiVersion: delivery.ocm.software/v1alpha1
    kind: Repository
    name: platform-mesh
    namespace: platform-mesh-system
    policy: Propagate
  resource:
    byReference:
      referencePath:
      - name: kro-composition-operator
      - name: image
      resource:
        name: image
