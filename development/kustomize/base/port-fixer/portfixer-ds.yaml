# port-fixer: socat DaemonSet that bridges Node:8443 -> traefik ClusterIP:8443
# on the runtime kind cluster.  Why:
#   - host kubeconfigs and external URLs (kcp.localhost, *.portal.localhost) use
#     :8443, but kind only port-maps 8443 on the control-plane node.
#   - Forwarding to 127.0.0.1:31000 (the traefik NodePort) does NOT work: nftables
#     NodePort DNAT only fires for traffic arriving on the node's external interface,
#     not loopback — so socat's outbound connection to 127.0.0.1 bypasses the rule.
#   - Forwarding directly to the traefik ClusterIP (10.96.188.4:8443) works because
#     the ClusterIP DNAT fires for all interfaces, including loopback on the host.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: port-fixer
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: port-fixer
  template:
    metadata:
      labels:
        app: port-fixer
    spec:
      hostNetwork: true # This binds directly to the Node's interface
      containers:
      - name: socat
        image: alpine/socat
        # Forward Node:8443 -> traefik ClusterIP:8443 (fixed IP defined in infra values)
        args: ["TCP-LISTEN:8443,fork", "TCP:10.96.188.4:8443"]
